name: Update official data and publish
on:
  workflow_dispatch:
  schedule:
        - cron: '30 4 1,11,21 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: housing-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize uploaded source package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p = Path('site-source.zip')
          if p.exists():
              with ZipFile(p) as z:
                  z.extractall('.')
              p.unlink()
          PY
      - name: Refresh official records
        run: python update.py
      - name: Verify data
        run: python test_data.py
      - name: Preserve release history
        run: |
          git config user.name 'housing-data-bot'
          git config user.email 'housing-data-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Update official housing data'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
